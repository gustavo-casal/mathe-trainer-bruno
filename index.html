<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathe-Trainer · Bruno</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;800&display=swap');
  :root {
    --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;
    --accent1:#6c63ff;--accent2:#ff6584;--accent3:#43e97b;--accent4:#f7971e;
    --text:#e8eaf6;--text-muted:#8b90b8;--radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .header{background:var(--surface);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(108,99,255,0.2);}
  .header-title{font-family:'Baloo 2',cursive;font-size:1.4rem;font-weight:800;background:linear-gradient(90deg,#6c63ff,#43e97b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .header-sub{font-size:0.75rem;color:var(--text-muted);}
  .timer-pill{background:var(--surface2);border-radius:99px;padding:5px 14px;font-size:0.85rem;font-weight:700;color:var(--accent4);}
  .daily-bar-wrap{max-width:720px;margin:16px auto 0;padding:0 24px;}
  .daily-bar-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .daily-bar-title{font-weight:800;font-size:1rem;color:var(--text);}
  .daily-bar-pct{font-size:0.8rem;color:var(--text-muted);font-weight:700;}
  .daily-bar-track{height:22px;background:var(--surface2);border-radius:99px;overflow:hidden;border:2px solid rgba(255,255,255,0.05);}
  .daily-bar-fill{height:100%;width:0%;border-radius:99px;transition:width 1s ease, background 1s ease;}
  .level-up-toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#6c63ff,#43e97b);color:white;padding:12px 24px;border-radius:99px;font-weight:800;font-size:0.9rem;z-index:200;opacity:0;transition:opacity 0.4s;pointer-events:none;}
  .level-up-toast.show{opacity:1;}
  .tabs{max-width:720px;margin:14px auto 0;display:flex;gap:10px;padding:0 24px;overflow-x:auto;scrollbar-width:none;}
  .tab{flex-shrink:0;padding:8px 18px;border-radius:99px;border:2px solid transparent;background:var(--surface);color:var(--text-muted);font-family:'Nunito',sans-serif;font-weight:700;font-size:0.82rem;cursor:default;}
  .tab.active{background:var(--accent1);color:white;}
  .tab .badge{background:rgba(255,255,255,0.2);border-radius:99px;padding:1px 7px;font-size:0.7rem;margin-left:4px;}
  .main{max-width:720px;margin:0 auto;padding:16px 24px 32px;}
  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .stat-card{background:var(--surface);border-radius:12px;padding:14px;text-align:center;border:1px solid var(--surface2);}
  .stat-val{font-family:'Baloo 2',cursive;font-size:1.6rem;font-weight:800;}
  .stat-label{font-size:0.7rem;color:var(--text-muted);margin-top:2px;}
  .card{background:var(--surface);border-radius:var(--radius);padding:28px;margin-bottom:16px;border:1px solid rgba(108,99,255,0.1);position:relative;overflow:hidden;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent1),var(--accent3));}
  .level-row{display:flex;gap:8px;margin-bottom:20px;}
  .level-btn{padding:5px 14px;border-radius:99px;border:2px solid var(--surface2);background:transparent;color:var(--text-muted);font-family:'Nunito',sans-serif;font-weight:700;font-size:0.75rem;cursor:pointer;transition:all 0.2s;}
  .level-btn.active{border-color:var(--accent4);color:var(--accent4);background:rgba(247,151,30,0.1);}
  .topic-icon{font-size:2rem;display:block;margin-bottom:6px;}
  .topic-label{font-size:0.72rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:6px;}
  .question-text{font-family:'Baloo 2',cursive;font-size:1.4rem;font-weight:600;line-height:1.4;margin-bottom:20px;}
  .math-expr{display:inline-block;background:var(--surface2);padding:2px 10px;border-radius:8px;font-family:'Courier New',monospace;color:#43e97b;font-size:1rem;}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .option-btn{padding:14px;border-radius:12px;border:2px solid var(--surface2);background:var(--surface2);color:var(--text);font-family:'Nunito',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;transition:all 0.15s;text-align:center;}
  .option-btn:hover:not(:disabled){border-color:var(--accent1);background:rgba(108,99,255,0.1);}
  .option-btn.correct{border-color:var(--accent3);background:rgba(67,233,123,0.15);color:var(--accent3);}
  .option-btn.wrong{border-color:var(--accent2);background:rgba(255,101,132,0.1);color:var(--accent2);}
  .input-row{display:flex;gap:10px;margin-bottom:16px;}
  .answer-input{flex:1;padding:14px 18px;border-radius:12px;border:2px solid var(--surface2);background:var(--surface2);color:var(--text);font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:700;outline:none;transition:border-color 0.2s;}
  .answer-input:focus{border-color:var(--accent1);}
  .answer-input.correct{border-color:var(--accent3);}
  .answer-input.wrong{border-color:var(--accent2);}
  .submit-btn{padding:14px 22px;border-radius:12px;border:none;background:var(--accent1);color:white;font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;}
  .feedback{padding:12px 16px;border-radius:12px;margin-bottom:14px;font-weight:700;font-size:0.9rem;display:none;}
  .feedback.correct{background:rgba(67,233,123,0.12);color:var(--accent3);border:1px solid rgba(67,233,123,0.25);display:block;}
  .feedback.wrong{background:rgba(255,101,132,0.08);color:#ff8fa3;border:1px solid rgba(255,101,132,0.2);display:block;}
  .hint-btn{background:none;border:1px dashed var(--surface2);color:var(--text-muted);border-radius:8px;padding:6px 14px;font-family:'Nunito',sans-serif;font-size:0.78rem;cursor:pointer;margin-bottom:14px;}
  .hint-box{background:rgba(247,151,30,0.08);border:1px solid rgba(247,151,30,0.2);border-radius:10px;padding:10px 14px;font-size:0.83rem;color:var(--accent4);margin-bottom:14px;display:none;}
  .next-btn{width:100%;padding:15px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent1),#8b5cf6);color:white;font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;display:none;}
  .next-btn.visible{display:block;}
  .report-card{background:var(--surface);border-radius:var(--radius);padding:20px;border:1px solid rgba(108,99,255,0.12);}
  .report-title{font-size:0.75rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:14px;font-weight:800;}
  .report-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .report-topic{flex:0 0 200px;font-weight:700;font-size:0.85rem;}
  .report-bar-track{flex:1;height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;}
  .report-bar-fill{height:100%;border-radius:99px;transition:width 0.8s;}
  .report-pct{flex:0 0 42px;text-align:right;font-weight:800;font-size:0.85rem;}
  .finish-card{text-align:center;padding:32px 20px;}
  .finish-emoji{font-size:3.5rem;margin-bottom:14px;}
  .finish-title{font-family:'Baloo 2',cursive;font-size:1.8rem;font-weight:800;margin-bottom:8px;}
  .finish-sub{color:var(--text-muted);margin-bottom:8px;font-size:1rem;}
  .finish-scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0;text-align:center;}
  .finish-score-item{background:var(--surface2);border-radius:12px;padding:12px;}
  .finish-score-val{font-family:'Baloo 2',cursive;font-size:1.4rem;font-weight:800;}
  .finish-score-label{font-size:0.7rem;color:var(--text-muted);margin-top:4px;}
  .save-btn{width:100%;padding:15px;border-radius:12px;border:none;background:linear-gradient(135deg,#43e97b,#38f9d7);color:#0f1117;font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;margin-bottom:10px;}
  .save-btn:disabled{opacity:0.5;cursor:default;}
  .restart-btn{width:100%;padding:14px;border-radius:12px;border:2px solid var(--accent1);background:transparent;color:var(--accent1);font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;}
  .save-status{margin-bottom:10px;font-size:0.85rem;font-weight:700;padding:10px;border-radius:10px;display:none;}
  .save-status.ok{background:rgba(67,233,123,0.12);color:var(--accent3);border:1px solid rgba(67,233,123,0.25);display:block;}
  .save-status.err{background:rgba(255,101,132,0.08);color:#ff8fa3;border:1px solid rgba(255,101,132,0.2);display:block;}
  .goal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;}
  .goal-box{background:var(--surface);border-radius:24px;padding:40px 32px;text-align:center;max-width:400px;width:100%;border:2px solid #43e97b;box-shadow:0 0 40px rgba(67,233,123,0.25);}
  .goal-emoji{font-size:4rem;margin-bottom:16px;}
  .goal-title{font-family:'Baloo 2',cursive;font-size:2rem;font-weight:800;color:#43e97b;margin-bottom:8px;}
  .goal-sub{color:var(--text-muted);font-size:1rem;margin-bottom:24px;}
  .goal-continue-btn{width:100%;padding:15px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent1),#8b5cf6);color:white;font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;margin-bottom:10px;}
  .goal-save-btn{width:100%;padding:14px;border-radius:12px;border:2px solid #43e97b;background:transparent;color:#43e97b;font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;}
  .version-tag{font-size:0.65rem;color:var(--text-muted);margin-top:2px;}
</style>
</head>
<body>
<div class="level-up-toast" id="level-up-toast"></div>
<div class="header">
  <div>
    <div class="header-title">🧮 Mathe-Trainer</div>
    <div class="header-sub">Bruno · 7. Klasse · Realschule Bayern</div>
    <div class="version-tag">v2 · Mathematik heute 7 II/III</div>
  </div>
  <div class="timer-pill">⏱ <span id="timer">00:00</span></div>
</div>
<div class="daily-bar-wrap">
  <div class="daily-bar-label">
    <span class="daily-bar-title">Heute geübt: <span id="daily-label">0 / 20 Min</span></span>
    <span class="daily-bar-pct" id="daily-pct">0%</span>
  </div>
  <div class="daily-bar-track"><div class="daily-bar-fill" id="daily-bar-fill"></div></div>
</div>
<div class="tabs" id="tabs"></div>
<div class="main">
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="stat-correct" style="color:var(--accent3)">0</div><div class="stat-label">✅ Richtig</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-wrong" style="color:var(--accent2)">0</div><div class="stat-label">❌ Falsch</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-pct" style="color:var(--accent1)">—</div><div class="stat-label">📊 Score</div></div>
  </div>
  <div class="card" id="question-card">
    <div class="level-row" id="level-row"></div>
    <span class="topic-icon" id="topic-icon"></span>
    <div class="topic-label" id="topic-label"></div>
    <div class="question-text" id="question-text"></div>
    <button class="hint-btn" id="hint-btn" onclick="showHint()">💡 Tipp anzeigen</button>
    <div class="hint-box" id="hint-box"></div>
    <div class="options" id="options-container"></div>
    <div class="input-row" id="input-container" style="display:none">
      <input type="number" class="answer-input" id="answer-input" placeholder="Antwort eingeben..."/>
      <button class="submit-btn" onclick="checkInput()">OK</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Weiter →</button>
  </div>
  <div class="report-card">
    <div class="report-title">📈 Fortschritt dieser Session</div>
    <div id="weekly-report"><div style="color:var(--text-muted);font-size:0.85rem">Noch keine Aufgaben gelöst.</div></div>
  </div>
</div>
<script>
var SCRIPT_URL='https://script.google.com/macros/s/AKfycbwJPaHyXHP6fwIY1QwBjbohUz9aCuuBJwO0PWInHhfEgAyeDy5zOzvZIs9_PJbSqz62UA/exec';
var GOAL_SEC=20*60;
var LEVELS=['leicht','mittel','schwer'];
 
// ============================================================
// THEMEN: Mathematik heute 7 II/III · Realschule Bayern
// ============================================================
var topics=[
  {
    id:'dreisatz',
    label:'Proportionalität & Dreisatz',
    icon:'📊',
    color:'#6c63ff',
    questions:{
      leicht:[
        {type:'mc',q:'3 Brötchen kosten 1,80 €. Was kosten 5 Brötchen?',options:['3,00 €','2,80 €','3,50 €','2,50 €'],answer:'3,00 €',hint:'1,80 ÷ 3 = 0,60 € pro Stück. Dann: 0,60 × 5'},
        {type:'mc',q:'Was bedeutet „direkt proportional"?',options:['Wenn x doppelt so groß wird, wird y auch doppelt so groß','Wenn x größer wird, wird y kleiner','x + y bleibt immer gleich','x × y bleibt immer gleich'],answer:'Wenn x doppelt so groß wird, wird y auch doppelt so groß',hint:'y = k · x: verdoppelst du x, verdoppelt sich y'},
        {type:'input',q:'Ein Auto verbraucht 6 Liter Benzin auf 100 km. Wie viele Liter für 250 km?',answer:'15',hint:'6 ÷ 100 = 0,06 L/km. Dann: 0,06 × 250 = 15'},
        {type:'mc',q:'Maßstab 1:200000. Eine Strecke auf der Karte ist 3 cm. Wie lang ist sie in km?',options:['6 km','60 km','0,6 km','3 km'],answer:'6 km',hint:'3 × 200000 = 600000 cm = 6000 m = 6 km'},
        {type:'input',q:'8 Hefte kosten 6,40 €. Was kostet 1 Heft? (€)',answer:'0.8',hint:'6,40 ÷ 8 = 0,80 €'}
      ],
      mittel:[
        {type:'input',q:'5 Näherinnen nähen in 4 Tagen 200 Hemden. Wie lange brauchen 4 Näherinnen für dieselbe Menge? (Tage)',answer:'5',hint:'5 × 4 = 20 Arbeitstage gesamt. 20 ÷ 4 = 5'},
        {type:'mc',q:'Bei indirekter Proportionalität gilt:',options:['x · y = konstant','x / y = konstant','x + y = konstant','x - y = konstant'],answer:'x · y = konstant',hint:'Mehr Arbeiter = weniger Tage. Das Produkt bleibt gleich.'},
        {type:'input',q:'y ist direkt proportional zu x. Bei x = 5 ist y = 35. Was ist der Proportionalitätsfaktor k?',answer:'7',hint:'k = y ÷ x = 35 ÷ 5 = 7'},
        {type:'mc',q:'Maßstab 1:25000 bedeutet:',options:['1 cm auf der Karte = 250 m in Wirklichkeit','1 cm auf der Karte = 25 m in Wirklichkeit','1 cm auf der Karte = 2,5 km in Wirklichkeit','1 cm auf der Karte = 25 km in Wirklichkeit'],answer:'1 cm auf der Karte = 250 m in Wirklichkeit',hint:'1 cm × 25000 = 25000 cm = 250 m'},
        {type:'mc',q:'12 Maschinen füllen 600 Flaschen in 5 Min. Wie viele Flaschen füllen 4 Maschinen?',options:['200','150','300','400'],answer:'200',hint:'Direkte Proportionalität. 600 ÷ 12 × 4 = 200'}
      ],
      schwer:[
        {type:'mc',q:'Eine Reise dauert mit 80 km/h genau 3 Stunden. Wie lange dauert sie mit 120 km/h?',options:['2 h','1,5 h','4 h','2,5 h'],answer:'2 h',hint:'80 × 3 = 240 km. 240 ÷ 120 = 2'},
        {type:'mc',q:'Ein Rezept für 4 Personen braucht 300 g Mehl. Für 7 Personen?',options:['525 g','450 g','500 g','600 g'],answer:'525 g',hint:'300 ÷ 4 × 7 = 75 × 7 = 525'},
        {type:'input',q:'3 Pumpen füllen einen Tank in 8 Stunden. Wie lange braucht nur 1 Pumpe allein? (h)',answer:'24',hint:'3 × 8 = 24 Pumpenstunden. 1 Pumpe: 24 ÷ 1 = 24'},
        {type:'mc',q:'Verhältnis Breite:Länge eines Rechtecks = 3:5. Umfang = 80 cm. Wie breit ist es?',options:['15 cm','20 cm','25 cm','30 cm'],answer:'15 cm',hint:'2(3x + 5x) = 80 → 16x = 80 → x = 5 → Breite = 3 × 5 = 15'},
        {type:'mc',q:'Verhältnis a:b = 2:5. Wenn a = 16, was ist b?',options:['40','20','8','10'],answer:'40',hint:'2/5 = 16/b → b = 16 × 5 ÷ 2 = 40'}
      ]
    }
  },
  {
    id:'prozent',
    label:'Prozentrechnung',
    icon:'💰',
    color:'#f7971e',
    questions:{
      leicht:[
        {type:'mc',q:'Was sind 10% von 80 €?',options:['8 €','16 €','18 €','40 €'],answer:'8 €',hint:'10 % = 1/10. Dann: 80 ÷ 10 = 8'},
        {type:'input',q:'Ein Fahrrad kostet 240 €. Es gibt 25% Rabatt. Was kostet es jetzt? (€)',answer:'180',hint:'25% von 240 = 60. Dann: 240 − 60 = 180'},
        {type:'mc',q:'Wie viel Prozent ist 15 von 60?',options:['25%','20%','15%','30%'],answer:'25%',hint:'15 ÷ 60 × 100 = 25'},
        {type:'input',q:'Grundwert G = 200, Prozentsatz p = 30%. Prozentwert W = ?',answer:'60',hint:'W = G × p ÷ 100 = 200 × 0,3 = 60'},
        {type:'mc',q:'Eine Jacke kostet 120 €, reduziert um 15%. Neuer Preis?',options:['102 €','105 €','108 €','100 €'],answer:'102 €',hint:'15% von 120 = 18. Dann: 120 − 18 = 102'}
      ],
      mittel:[
        {type:'input',q:'Nach 20% Preissenkung kostet ein Laptop 640 €. Ursprünglicher Preis? (€)',answer:'800',hint:'640 = 80% von G. G = 640 ÷ 0,8 = 800'},
        {type:'mc',q:'Eine Stadt hat 50.000 Einwohner. Die Zahl steigt um 4%. Wie viele Einwohner danach?',options:['52.000','54.000','51.000','52.500'],answer:'52.000',hint:'4% von 50000 = 2000. Dann: 50000 + 2000'},
        {type:'mc',q:'Der Prozentsatz p berechnet sich aus:',options:['p = W / G × 100','p = G / W × 100','p = W × G','p = G − W'],answer:'p = W / G × 100',hint:'p% = (Prozentwert ÷ Grundwert) × 100'},
        {type:'input',q:'Prozentsatz p = 8%, Grundwert G = 350 €. Prozentwert W = ? (€)',answer:'28',hint:'W = 350 × 8 ÷ 100 = 350 × 0,08 = 28'},
        {type:'mc',q:'Eine Aktie steigt von 50 € auf 65 €. Wie viel % Steigerung?',options:['30%','25%','15%','20%'],answer:'30%',hint:'(65 − 50) ÷ 50 × 100 = 15 ÷ 50 × 100 = 30'}
      ],
      schwer:[
        {type:'input',q:'Kapital K = 2000 €, Zinssatz p = 3% pro Jahr. Zinsen nach 1 Jahr? (€)',answer:'60',hint:'Z = K × p ÷ 100 = 2000 × 3 ÷ 100 = 60'},
        {type:'mc',q:'Zinsen Z = 75 €, Kapital K = 1500 €, Laufzeit 1 Jahr. Zinssatz p = ?',options:['5%','4%','6%','3%'],answer:'5%',hint:'p = Z ÷ K × 100 = 75 ÷ 1500 × 100 = 5'},
        {type:'input',q:'Kapital 5000 €, Zinssatz 2% pro Jahr, Laufzeit 3 Jahre. Gesamtzinsen? (€)',answer:'300',hint:'Z = 5000 × 0,02 × 3 = 300'},
        {type:'mc',q:'Ein Preis wurde zweimal um 20% reduziert. Wie viel % des Originalpreises bleibt?',options:['64%','60%','40%','80%'],answer:'64%',hint:'0,8 × 0,8 = 0,64 = 64%'},
        {type:'input',q:'Laufzeit 2 Jahre, Zinssatz 4%, Zinsen Z = 240 €. Kapital K = ? (€)',answer:'3000',hint:'Z = K × p/100 × t → 240 = K × 0,04 × 2 → K = 240 ÷ 0,08 = 3000'}
      ]
    }
  },
  {
    id:'thales',
    label:'Geometrie & Satz des Thales',
    icon:'📐',
    color:'#43e97b',
    questions:{
      leicht:[
        {type:'mc',q:'Was sagt der Satz des Thales?',options:['Jeder Winkel im Halbkreis über dem Durchmesser ist 90°','Ein Dreieck hat immer eine Winkelsumme von 180°','Die Hypotenuse ist die längste Seite','Zwei Geraden schneiden sich in einem Punkt'],answer:'Jeder Winkel im Halbkreis über dem Durchmesser ist 90°',hint:'Liegt Punkt P auf dem Halbkreis über AB, gilt immer: Winkel APB = 90°'},
        {type:'mc',q:'Eine Tangente an einen Kreis...',options:['berührt den Kreis in genau einem Punkt','schneidet den Kreis in zwei Punkten','geht durch den Mittelpunkt','ist parallel zum Radius'],answer:'berührt den Kreis in genau einem Punkt',hint:'Tangente kommt von „tangere" = berühren'},
        {type:'mc',q:'Die Mittelsenkrechte einer Strecke AB...',options:['steht senkrecht auf AB und geht durch die Mitte','ist parallel zu AB','verbindet A und B','geht nur durch A'],answer:'steht senkrecht auf AB und geht durch die Mitte',hint:'Mittel = Mitte der Strecke; Senkrechte = 90°'},
        {type:'mc',q:'Alle Punkte der Mittelsenkrechten von AB sind...',options:['gleich weit von A und B entfernt','näher an Punkt A','näher an Punkt B','auf der Strecke AB'],answer:'gleich weit von A und B entfernt',hint:'Das ist die Ortslinieneigenschaft der Mittelsenkrechte'},
        {type:'mc',q:'Die Winkelhalbierende...',options:['teilt einen Winkel in zwei gleich große Teile','halbiert eine Strecke','steht senkrecht auf einer Seite','verbindet Ecke mit gegenüberliegender Seite'],answer:'teilt einen Winkel in zwei gleich große Teile',hint:'Halbierende = in zwei gleiche Hälften teilen'},
        {type:'mc',q:'Eine Gerade, die einen Kreis in zwei Punkten schneidet, heißt...',options:['Sekante','Tangente','Passante','Sehne'],answer:'Sekante',hint:'Sekante schneidet den Kreis in 2 Punkten (lat. secare = schneiden)'},
        {type:'mc',q:'Eine Strecke, die zwei Punkte auf dem Kreis verbindet, heißt...',options:['Sehne','Tangente','Radius','Passante'],answer:'Sehne',hint:'Die längste Sehne eines Kreises ist der Durchmesser'}
      ],
      mittel:[
        {type:'mc',q:'P liegt auf dem Thales-Kreis über Durchmesser AB. Was gilt für Winkel APB?',options:['Er ist 90°','Er ist 45°','Er ist 60°','Er ist 180°'],answer:'Er ist 90°',hint:'Satz des Thales: Winkel am Kreisbogen über dem Durchmesser = 90°'},
        {type:'input',q:'AB ist Durchmesser = 10 cm. Punkt P liegt auf dem Kreis. PA = 6 cm. PB = ? (cm)',answer:'8',hint:'Winkel P = 90° → Pythagoras: 6² + PB² = 10². PB² = 64. PB = 8'},
        {type:'mc',q:'Wo liegt der Umkreismittelpunkt eines rechtwinkligen Dreiecks?',options:['In der Mitte der Hypotenuse','Im Schwerpunkt','In der Mitte der längsten Kathete','Im Höhenschnittpunkt'],answer:'In der Mitte der Hypotenuse',hint:'Umkehrung des Satzes des Thales'},
        {type:'mc',q:'Eine Tangente steht auf dem Radius im Berührungspunkt...',options:['senkrecht (90°)','parallel (0°)','in 45°','in 60°'],answer:'senkrecht (90°)',hint:'Radius ⊥ Tangente ist ein Grundgesetz der Kreisgeometrie'},
        {type:'mc',q:'Der Umkreismittelpunkt eines Dreiecks liegt im Schnittpunkt der...',options:['drei Mittelsenkrechten','drei Winkelhalbierenden','drei Höhen','drei Seitenhalbierenden'],answer:'drei Mittelsenkrechten',hint:'Umkreismittelpunkt = gleicher Abstand zu allen 3 Ecken'},
        {type:'mc',q:'Eine Gerade, die den Kreis weder berührt noch schneidet, heißt...',options:['Passante','Sekante','Sehne','Tangente'],answer:'Passante',hint:'Passante geht am Kreis vorbei – kein gemeinsamer Punkt'},
        {type:'mc',q:'Der Abstand eines Punktes P vom Mittelpunkt M ist kleiner als der Radius. Wo liegt P?',options:['innerhalb des Kreises','auf dem Kreis','außerhalb des Kreises','auf der Tangente'],answer:'innerhalb des Kreises',hint:'Abstand < r → innen; = r → auf dem Kreis; > r → außen'}
      ],
      schwer:[
        {type:'input',q:'Rechtwinkliges Dreieck: Winkel C = 90°, CA = 8 cm, CB = 15 cm. AB = ? (cm)',answer:'17',hint:'AB² = 8² + 15² = 64 + 225 = 289. √289 = 17'},
        {type:'mc',q:'Die Mittelparallele (Mittellinie) eines Dreiecks...',options:['verbindet die Mitten zweier Seiten und ist halb so lang wie die dritte Seite','halbiert alle drei Seiten','geht durch alle Eckpunkte','ist die längste Linie'],answer:'verbindet die Mitten zweier Seiten und ist halb so lang wie die dritte Seite',hint:'Mittelparallele ist parallel zur Grundlinie und halb so lang'},
        {type:'mc',q:'Eine Seitenhalbierende (Median) eines Dreiecks...',options:['verbindet einen Eckpunkt mit der Mitte der gegenüberliegenden Seite','steht senkrecht auf der Seite','halbiert den Winkel','ist der Umkreisradius'],answer:'verbindet einen Eckpunkt mit der Mitte der gegenüberliegenden Seite',hint:'Die drei Seitenhalbierenden treffen sich im Schwerpunkt'},
        {type:'mc',q:'Auf der Ortslinie „Mittelsenkrechte von AB" liegen alle Punkte P, für die gilt:',options:['PA = PB','PA > PB','PA < PB','P liegt auf AB'],answer:'PA = PB',hint:'Mittelsenkrechte = Ortslinie mit gleichem Abstand zu A und B'},
        {type:'input',q:'Mittelpunkt M(3|2), Punkt P(7|2) liegt auf dem Kreis. Radius r = ? (cm)',answer:'4',hint:'r = Abstand von M zu P = |7 − 3| = 4'},
        {type:'mc',q:'Ein Kreis hat Radius r = 5 cm. Punkt P ist 7 cm vom Mittelpunkt entfernt. Wo liegt P?',options:['außerhalb des Kreises','innerhalb des Kreises','auf dem Kreis','im Mittelpunkt'],answer:'außerhalb des Kreises',hint:'Abstand 7 cm > Radius 5 cm → P liegt außerhalb'},
        {type:'input',q:'Wie lang ist die längste Sehne in einem Kreis mit Radius 6 cm? (cm)',answer:'12',hint:'Die längste Sehne ist der Durchmesser = 2 × r = 2 × 6 = 12'}
      ]
    }
  }
];
 
// ============================================================
// STATE
// ============================================================
var state={
  level:'leicht',answered:false,correct:0,wrong:0,total:0,
  topicStats:{
    dreisatz:{correct:0,total:0},
    prozent:{correct:0,total:0},
    thales:{correct:0,total:0}
  },
  sessionQueue:[],sessionPos:0,elapsedSec:0,timerInterval:null,
  startTime:null,goalReached:false,consecutiveCorrect:0
};
var ADAPTIVE_THRESHOLD=3;
 
function buildSession(){
  state.sessionQueue=[];state.sessionPos=0;state.correct=0;state.wrong=0;state.total=0;
  state.topicStats={dreisatz:{correct:0,total:0},prozent:{correct:0,total:0},thales:{correct:0,total:0}};
  state.startTime=new Date();state.consecutiveCorrect=0;
  var lq={};
  topics.forEach(function(t){
    var arr=[];for(var i=0;i<t.questions[state.level].length;i++)arr.push(i);
    arr.sort(function(){return Math.random()-0.5;});lq[t.id]=arr.slice();
  });
  function getFrom(tid){
    if(!lq[tid]||!lq[tid].length){
      var t=topics.find(function(x){return x.id===tid;});
      var arr=[];for(var i=0;i<t.questions[state.level].length;i++)arr.push(i);
      arr.sort(function(){return Math.random()-0.5;});lq[tid]=arr;
    }
    return lq[tid].shift();
  }
  for(var i=0;i<60;i++){
    var t=topics[i%topics.length];var idx=getFrom(t.id);
    var q=Object.assign({},t.questions[state.level][idx],{topicId:t.id,topicLabel:t.label,topicIcon:t.icon});
    state.sessionQueue.push(q);
  }
}
 
function rebuildQueueForLevel(newLevel){
  state.sessionQueue=state.sessionQueue.slice(0,state.sessionPos+1);
  var lq={};
  topics.forEach(function(t){
    var arr=[];for(var i=0;i<t.questions[newLevel].length;i++)arr.push(i);
    arr.sort(function(){return Math.random()-0.5;});lq[t.id]=arr.slice();
  });
  function getFrom(tid){
    if(!lq[tid]||!lq[tid].length){
      var t=topics.find(function(x){return x.id===tid;});
      var arr=[];for(var i=0;i<t.questions[newLevel].length;i++)arr.push(i);
      arr.sort(function(){return Math.random()-0.5;});lq[tid]=arr;
    }
    return lq[tid].shift();
  }
  for(var i=0;i<50;i++){
    var t=topics[i%topics.length];var idx=getFrom(t.id);
    var q=Object.assign({},t.questions[newLevel][idx],{topicId:t.id,topicLabel:t.label,topicIcon:t.icon});
    state.sessionQueue.push(q);
  }
}
 
function checkAdaptiveLevel(ok){
  if(ok){state.consecutiveCorrect++;
    if(state.consecutiveCorrect>=ADAPTIVE_THRESHOLD){
      var ci=LEVELS.indexOf(state.level);
      if(ci<LEVELS.length-1){var nl=LEVELS[ci+1];state.level=nl;state.consecutiveCorrect=0;rebuildQueueForLevel(nl);renderLevels();showLevelUpToast(nl);}
      else{state.consecutiveCorrect=0;}
    }
  }else{state.consecutiveCorrect=0;}
}
 
function showLevelUpToast(level){
  var labels={mittel:'🟡 Level Up! Jetzt: Mittel',schwer:'🔴 Level Up! Jetzt: Schwer'};
  var toast=document.getElementById('level-up-toast');toast.textContent=labels[level]||'⬆️ Level Up!';
  toast.classList.add('show');setTimeout(function(){toast.classList.remove('show');},2500);
}
 
function getCurrent(){return state.sessionQueue[state.sessionPos];}
 
function renderTabs(){
  var c=document.getElementById('tabs');c.innerHTML='';
  var cur=getCurrent()?getCurrent().topicId:null;
  topics.forEach(function(t){
    var s=state.topicStats[t.id];
    var pct=s.total>0?Math.round(s.correct/s.total*100):null;
    var btn=document.createElement('button');
    btn.className='tab'+(t.id===cur?' active':'');
    btn.innerHTML=t.icon+' '+t.label+(pct!==null?'<span class="badge">'+pct+'%</span>':'');
    c.appendChild(btn);
  });
}
 
function renderLevels(){
  var row=document.getElementById('level-row');row.innerHTML='';
  var labels={leicht:'🟢 Leicht',mittel:'🟡 Mittel',schwer:'🔴 Schwer'};
  LEVELS.forEach(function(l){
    var btn=document.createElement('button');
    btn.className='level-btn'+(state.level===l?' active':'');
    btn.textContent=labels[l];
    btn.onclick=function(){state.level=l;state.consecutiveCorrect=0;rebuildQueueForLevel(l);renderAll();};
    row.appendChild(btn);
  });
}
 
function renderQuestion(){
  var q=getCurrent();if(!q)return;
  document.getElementById('topic-icon').textContent=q.topicIcon;
  document.getElementById('topic-label').textContent=q.topicLabel;
  document.getElementById('question-text').innerHTML=q.q;
  // FIX: Tipp erst nach falscher Antwort anzeigen
  document.getElementById('hint-btn').style.display='none';
  document.getElementById('hint-box').style.display='none';
  document.getElementById('hint-box').textContent=q.hint;
  document.getElementById('feedback').className='feedback';
  document.getElementById('next-btn').className='next-btn';
  state.answered=false;
  var oc=document.getElementById('options-container');
  var ic=document.getElementById('input-container');
  var inp=document.getElementById('answer-input');
  if(q.type==='mc'){
    oc.style.display='grid';ic.style.display='none';oc.innerHTML='';
    q.options.slice().sort(function(){return Math.random()-0.5;}).forEach(function(opt){
      var btn=document.createElement('button');
      btn.className='option-btn';btn.textContent=opt;
      btn.onclick=function(){checkMC(opt,btn);};
      oc.appendChild(btn);
    });
  }else{
    oc.style.display='none';ic.style.display='flex';
    inp.value='';inp.className='answer-input';inp.disabled=false;
    inp.onkeydown=function(e){if(e.key==='Enter')checkInput();};
    setTimeout(function(){inp.focus();},100);
  }
  renderTabs();
}
 
function checkMC(selected,btn){
  if(state.answered)return;
  state.answered=true;
  var q=getCurrent();
  var ok=selected===q.answer;
  record(ok,q.topicId);
  document.querySelectorAll('.option-btn').forEach(function(b){
    b.disabled=true;
    if(b.textContent===q.answer)b.classList.add('correct');
  });
  if(!ok)btn.classList.add('wrong');
  showFeedback(ok,q.answer);
  checkAdaptiveLevel(ok);
}
 
function checkInput(){
  if(state.answered)return;
  var inp=document.getElementById('answer-input');
  var val=inp.value.trim().replace(',','.');
  var q=getCurrent();
  var ok=val===String(q.answer).replace(',','.');
  state.answered=true;
  inp.disabled=true;
  inp.className='answer-input '+(ok?'correct':'wrong');
  record(ok,q.topicId);
  showFeedback(ok,q.answer);
  checkAdaptiveLevel(ok);
}
 
function record(ok,topicId){
  state.total++;
  if(ok){state.correct++;state.topicStats[topicId].correct++;}
  else state.wrong++;
  state.topicStats[topicId].total++;
  updateStats();renderWeekly();renderTabs();
}
 
function showFeedback(ok,answer){
  var fb=document.getElementById('feedback');
  var hb=document.getElementById('hint-btn');
  var hbox=document.getElementById('hint-box');
  if(ok){
    var msgs=['Super! Richtig! 🎉','Perfekt! 🌟','Ja, genau! ✅','Klasse! 🚀','Sehr gut! ⭐'];
    fb.textContent=msgs[Math.floor(Math.random()*msgs.length)];
    fb.className='feedback correct';
    hb.style.display='none';
    hbox.style.display='none';
  }else{
    fb.textContent='❌ Leider falsch. Richtige Antwort: '+answer;
    fb.className='feedback wrong';
    // FIX: Tipp erst NACH falscher Antwort sichtbar machen
    hb.style.display='inline-block';
  }
  document.getElementById('next-btn').className='next-btn visible';
}
 
function showHint(){
  document.getElementById('hint-box').style.display='block';
  document.getElementById('hint-btn').style.display='none';
}
 
function nextQuestion(){
  state.sessionPos++;
  if(state.sessionPos>=state.sessionQueue.length)rebuildQueueForLevel(state.level);
  renderQuestion();
}
 
function updateStats(){
  document.getElementById('stat-correct').textContent=state.correct;
  document.getElementById('stat-wrong').textContent=state.wrong;
  document.getElementById('stat-pct').textContent=state.total>0?Math.round(state.correct/state.total*100)+'%':'—';
}
 
function updateDailyBar(){
  var pct=Math.min(state.elapsedSec/GOAL_SEC*100,100);
  var fill=document.getElementById('daily-bar-fill');
  var mins=Math.floor(state.elapsedSec/60);
  document.getElementById('daily-label').textContent=mins+' / 20 Min';
  document.getElementById('daily-pct').textContent=Math.round(pct)+'%';
  fill.style.width=pct+'%';
  var r,g,b=0;
  if(pct<=50){var t=pct/50;r=255;g=Math.round(60+t*(165-60));}
  else{var t=(pct-50)/50;r=Math.round(255+t*(67-255));g=Math.round(165+t*(233-165));b=Math.round(t*123);}
  fill.style.background='rgb('+r+','+g+','+b+')';
}
 
function renderWeekly(){
  var c=document.getElementById('weekly-report');c.innerHTML='';
  var any=false;
  topics.forEach(function(t){
    var s=state.topicStats[t.id];
    if(s.total===0)return;
    any=true;
    var pct=Math.round(s.correct/s.total*100);
    var color=pct>=70?'#43e97b':pct>=40?'#f7971e':'#ff6584';
    c.innerHTML+='<div class="report-row"><div class="report-topic">'+t.icon+' '+t.label+'</div><div class="report-bar-track"><div class="report-bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div><div class="report-pct" style="color:'+color+'">'+pct+'%</div></div>';
  });
  if(!any)c.innerHTML='<div style="color:var(--text-muted);font-size:0.85rem">Noch keine Aufgaben gelöst.</div>';
}
 
function showGoalOverlay(){
  if(document.getElementById('goal-overlay'))return;
  var overlay=document.createElement('div');
  overlay.className='goal-overlay';overlay.id='goal-overlay';
  overlay.innerHTML='<div class="goal-box"><div class="goal-emoji">🎉</div><div class="goal-title">Super, Bruno!</div><div class="goal-sub">20 Minuten geschafft!</div><button class="goal-continue-btn" onclick="closeGoalOverlay()">💪 Weiter üben</button><button class="goal-save-btn" onclick="closeGoalAndFinish()">💾 Ergebnisse speichern</button></div>';
  document.body.appendChild(overlay);
}
 
function closeGoalOverlay(){var el=document.getElementById('goal-overlay');if(el)el.remove();}
function closeGoalAndFinish(){closeGoalOverlay();showFinish();}
 
function showFinish(){
  clearInterval(state.timerInterval);
  var pct=state.total>0?Math.round(state.correct/state.total*100):0;
  var emoji=pct>=80?'🏆':pct>=60?'💪':'📚';
  var msg=pct>=80?'Ausgezeichnet! Weiter so!':pct>=60?'Gut gemacht! Weiter üben!':'Nicht aufgeben — jeden Tag besser!';
  var ts=state.topicStats;
  var dauer=Math.round(state.elapsedSec/60);
  document.getElementById('question-card').innerHTML='<div class="finish-card">'
    +'<div class="finish-emoji">'+emoji+'</div>'
    +'<div class="finish-title">Geschafft!</div>'
    +'<div class="finish-sub">'+state.correct+' von '+state.total+' richtig — '+pct+'%</div>'
    +'<div class="finish-sub" style="margin-bottom:0">'+msg+'</div>'
    +'<div class="finish-scores">'
    +'<div class="finish-score-item"><div class="finish-score-val" style="color:#6c63ff">'+(ts.dreisatz.total>0?Math.round(ts.dreisatz.correct/ts.dreisatz.total*100)+'%':'—')+'</div><div class="finish-score-label">📊 Dreisatz</div></div>'
    +'<div class="finish-score-item"><div class="finish-score-val" style="color:#f7971e">'+(ts.prozent.total>0?Math.round(ts.prozent.correct/ts.prozent.total*100)+'%':'—')+'</div><div class="finish-score-label">💰 Prozent</div></div>'
    +'<div class="finish-score-item"><div class="finish-score-val" style="color:#43e97b">'+(ts.thales.total>0?Math.round(ts.thales.correct/ts.thales.total*100)+'%':'—')+'</div><div class="finish-score-label">📐 Geometrie</div></div>'
    +'</div>'
    +'<div class="save-status" id="save-status"></div>'
    +'<button class="save-btn" id="save-btn" onclick="saveResults('+pct+','+dauer+')">💾 Ergebnisse speichern</button>'
    +'<button class="restart-btn" onclick="restartSession()">🔁 Nochmal üben</button></div>';
}
 
function saveResults(pct,dauer){
  var btn=document.getElementById('save-btn');
  var status=document.getElementById('save-status');
  btn.disabled=true;btn.textContent='Wird gespeichert...';
  var ts=state.topicStats;
  // Mapping to Sheet columns: terme→dreisatz, prop→prozent, geo→thales
  var payload={
    level:state.level,
    terme:{pct:ts.dreisatz.total>0?Math.round(ts.dreisatz.correct/ts.dreisatz.total*100):0,correct:ts.dreisatz.correct,total:ts.dreisatz.total},
    prop:{pct:ts.prozent.total>0?Math.round(ts.prozent.correct/ts.prozent.total*100):0,correct:ts.prozent.correct,total:ts.prozent.total},
    geo:{pct:ts.thales.total>0?Math.round(ts.thales.correct/ts.thales.total*100):0,correct:ts.thales.correct,total:ts.thales.total},
    gesamt:{pct:pct,correct:state.correct,total:state.total},
    dauer:dauer
  };
  fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(payload)})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.status==='ok'){
        status.textContent='✅ Ergebnisse gespeichert! Papa kann deinen Fortschritt sehen.';
        status.className='save-status ok';btn.textContent='✅ Gespeichert';
      }else{throw new Error(d.message);}
    })
    .catch(function(){
      status.textContent='⚠️ Speichern fehlgeschlagen. Bitte Papa zeigen.';
      status.className='save-status err';btn.disabled=false;btn.textContent='💾 Nochmal versuchen';
    });
}
 
function restartSession(){
  state.elapsedSec=0;state.goalReached=false;state.consecutiveCorrect=0;
  buildSession();renderAll();startTimer();
}
 
function startTimer(){
  clearInterval(state.timerInterval);
  state.timerInterval=setInterval(function(){
    state.elapsedSec++;
    var m=String(Math.floor(state.elapsedSec/60)).padStart(2,'0');
    var s=String(state.elapsedSec%60).padStart(2,'0');
    document.getElementById('timer').textContent=m+':'+s;
    updateDailyBar();
    if(state.elapsedSec>=GOAL_SEC&&!state.goalReached){state.goalReached=true;showGoalOverlay();}
  },1000);
}
 
function renderAll(){renderLevels();renderQuestion();updateStats();renderWeekly();updateDailyBar();}
buildSession();renderAll();startTimer();
</script>
